# Homepage services.yaml snippet for roost
# Generated by genproj (docker-container capability).
# Append to your Homepage services.yaml (under the "Services" group) and enable
# the homepage Docker provider. The href defaults to localhost (the browser
# resolves it from your device); override `hostname` in the genproj
# configuration to point at your NAS hostname/IP. The URL uses the PUBLISHED
# HOST port (left-hand side of publishPort), not the container port.
#
# The widget reads `/api/homepage`, not `/healthz`: health says the container
# is up, which the Docker provider already knows, while the activity list says
# what the fleet is *doing*. `display: dynamic-list` renders one row per
# connected agent - the agent id on the left, its state and last event on the
# right - so the dashboard shows what the fleet page shows, at a glance. Agents
# whose tunnel is down are omitted: the widget answers "what is running".

- roost:
    icon: sh-docker
    href: http://localhost:3008/
    description: agent fleet activity
    widget:
      type: customapi
      url: http://localhost:3008/api/homepage
      refreshInterval: 10000
      display: dynamic-list
      mappings:
        items: agents
        name: agentId
        label: status
        limit: 12
        format: text
        target: http://localhost:3008/#/agent/{agentId}
