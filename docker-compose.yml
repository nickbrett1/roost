# Docker Compose configuration for roost
# Generated by genproj (docker-container capability).
#
# Deploy with: docker compose up -d
# (On Synology, import this file as a Container Manager "Project".)
#
# The image reference uses your registry namespace (GitHub username/org for
# GHCR). For public packages no registry credentials are required on the host.

services:
  app:
    image: ghcr.io/nickbrett1/roost:latest
    container_name: roost
    restart: unless-stopped

    ports:
      - "0.0.0.0:3008:3000"

    environment:
      # The home display the fleet page mirrors. `host.docker.internal` is the
      # NAS itself, where the display publishes port 3009; the `extra_hosts`
      # entry below is what makes that name resolve from inside the container.
      # The device's API is not on this compose network, so the published port
      # is the way in. Set ROOST_MIRROR_URL in .env to point elsewhere, or
      # remove this line to drop the panel entirely.
      ROOST_MIRROR_URL: ${ROOST_MIRROR_URL:-http://host.docker.internal:3009}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
      - "homepage.group=Services"
      - "homepage.name=roost"
      - "homepage.href=http://localhost:3008/"
      - "homepage.widget.type=customapi"
      - "homepage.widget.url=http://localhost:3008/healthz"
      - "homepage.widget.mappings[0].field=status"
      - "homepage.widget.mappings[0].label=Status"
